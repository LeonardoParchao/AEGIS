# OWASP API Top 10 Security Risk Detection Rules
# Version: 1.0.0
# Focus: API1 (Broken Object Level Authorization) and API6 (Unrestricted Access to Sensitive Business Flows)
# Maps OWASP API Security risks to Z3 constraints, eBPF tracepoints, and state machine rules

owasp_api_top10:
  version: "2023"
  description: "Detection rules for OWASP API Security Top 10 2023"
  
  # API1: Broken Object Level Authorization
  API1_2023_Broken_Object_Level_Authorization:
    category: "Authorization"
    severity: "critical"
    description: "APIs expose endpoints handling object identifiers without proper authorization checks"
    
    detection_rules:
      - name: "direct_object_access_bypass"
        description: "Detect direct access to objects by ID without authorization"
        z3_constraint: "Forall(user, object_id, request: Implies(api_request(user, object_id), authorized(user, object_id)))"
        ebpf_tracepoints:
          - "http_request_headers"
          - "file_access_trace"
        pattern: "user_attempts_to_access_unauthorized_object"
        
      - name: "id_oracle_attack"
        description: "Detect sequential ID enumeration attacks"
        z3_constraint: "Implies(sequence_of_requests(user, id1, id2, id3), And(abs(id2-id1)==1, abs(id3-id2)==1))"
        ebpf_tracepoints:
          - "net_trace"
          - "http_request_trace"
        pattern: "sequential_id_enumeration"
        
      - name: "ownership_validation_missing"
        description: "Detect missing ownership validation in object operations"
        z3_constraint: "Forall(user, object, operation: Implies(api_operation(user, object, operation), owns(user, object)))"
        ebpf_tracepoints:
          - "execve_trace"
          - "file_write_trace"
        pattern: "unauthorized_object_modification"
        
    state_machine_rules:
      - name: "object_access_flow"
        initial_state: "unauthenticated"
        states:
          - name: "unauthenticated"
            transitions:
              - to: "authenticated"
                condition: "valid_credentials"
          - name: "authenticated"
            transitions:
              - to: "object_access_request"
                condition: "valid_session"
          - name: "object_access_request"
            transitions:
              - to: "authorized_access"
                condition: "ownership_verified"
              - to: "unauthorized_access_attempt"
                condition: "Not(ownership_verified)"
        violation_detection:
          - "Direct transition to object_access without authentication"
          - "Object modification without ownership verification"
          
  # API2: Broken Authentication
  API2_2023_Broken_Authentication:
    category: "Authentication"
    severity: "critical"
    description: "Authentication mechanisms implemented incorrectly allowing identity compromise"
    
    detection_rules:
      - name: "token_exploitation"
        description: "Detect JWT token manipulation or weak token validation"
        z3_constraint: "Implies(token_present(token), signature_valid(token) AND not_expired(token))"
        ebpf_tracepoints:
          - "http_request_headers"
          - "net_trace"
        pattern: "weak_token_validation"
        
      - name: "credential_stuffing"
        description: "Detect automated authentication attempts with leaked credentials"
        z3_constraint: "Implies(failed_auth_attempts(user, count), count < threshold)"
        ebpf_tracepoints:
          - "net_trace"
          - "http_request_trace"
        pattern: "high_failed_auth_rate"
        
  # API3: Broken Object Property Level Authorization
  API3_2023_Broken_Object_Property_Level_Authorization:
    category: "Authorization"
    severity: "high"
    description: "Lack of authorization validation at object property level leading to exposure or manipulation"
    
    detection_rules:
      - name: "mass_assignment"
        description: "Detect mass assignment attacks on object properties"
        z3_constraint: "Forall(user, object, property: Implies(property_update(user, object, property), property_authorized(user, property)))"
        ebpf_tracepoints:
          - "http_request_body"
          - "file_write_trace"
        pattern: "unauthorized_property_modification"
        
      - name: "sensitive_property_exposure"
        description: "Detect exposure of sensitive object properties"
        z3_constraint: "Forall(user, object, property: Implies(property_visible(user, object, property), property_public(property)))"
        ebpf_tracepoints:
          - "http_response_body"
          - "net_trace"
        pattern: "sensitive_data_leak"
        
  # API4: Unrestricted Resource Consumption
  API4_2023_Unrestricted_Resource_Consumption:
    category: "Denial of Service"
    severity: "high"
    description: "API requests consuming resources without proper limits leading to DoS or cost escalation"
    
    detection_rules:
      - name: "resource_exhaustion"
        description: "Detect excessive resource consumption patterns"
        z3_constraint: "Forall(user, resource_type: Implies(resource_request(user, resource_type), within_limits(user, resource_type)))"
        ebpf_tracepoints:
          - "execve_trace"
          - "net_trace"
          - "file_trace"
        pattern: "excessive_resource_usage"
        
      - name: "rate_limit_bypass"
        description: "Detect attempts to bypass rate limiting"
        z3_constraint: "Implies(request_rate(user, rate), rate <= max_rate)"
        ebpf_tracepoints:
          - "net_trace"
          - "http_request_trace"
        pattern: "rate_limit_exceeded"
        
  # API5: Broken Function Level Authorization
  API5_2023_Broken_Function_Level_Authorization:
    category: "Authorization"
    severity: "high"
    description: "Complex access control policies leading to authorization flaws"
    
    detection_rules:
      - name: "privilege_escalation"
        description: "Detect attempts to access administrative functions"
        z3_constraint: "Forall(user, function: Implies(function_access(user, function), has_role(user, required_role(function))))"
        ebpf_tracepoints:
          - "http_request_trace"
          - "execve_trace"
        pattern: "unauthorized_admin_access"
        
      - name: "horizontal_privilege_escalation"
        description: "Detect access to other users' functions"
        z3_constraint: "Forall(user1, user2, function: Implies(function_access(user1, function, user2), same_tenant(user1, user2)))"
        ebpf_tracepoints:
          - "http_request_trace"
          - "net_trace"
        pattern: "cross_user_access"
        
  # API6: Unrestricted Access to Sensitive Business Flows
  API6_2023_Unrestricted_Access_to_Sensitive_Business_Flows:
    category: "Business Logic"
    severity: "critical"
    description: "Business flows exposed without compensation for automated abuse potential"
    
    detection_rules:
      - name: "business_flow_bypass"
        description: "Detect attempts to skip critical business logic steps"
        z3_constraint: "Implies(target_state == 'completion', Exists(path: Sequence[State], path.contains_all_required_states() AND path.is_valid()))"
        ebpf_tracepoints:
          - "http_request_trace"
          - "net_trace"
          - "execve_trace"
        pattern: "skipped_business_logic_step"
        
      - name: "automated_abuse_detection"
        description: "Detect automated execution of sensitive business flows"
        z3_constraint: "Implies(business_flow_execution(user, flow), not_automated(user) OR rate_limited(user, flow))"
        ebpf_tracepoints:
          - "net_trace"
          - "http_request_trace"
        pattern: "high_velocity_automated_requests"
        
      - name: "state_manipulation"
        description: "Detect manipulation of business state variables"
        z3_constraint: "Forall(user, state_var: Implies(state_modification(user, state_var), state_transition_valid(user, state_var)))"
        ebpf_tracepoints:
          - "http_request_body"
          - "file_write_trace"
        pattern: "invalid_state_transition"
        
    state_machine_rules:
      - name: "payment_flow_validation"
        initial_state: "cart"
        states:
          - name: "cart"
            required_context: ["user_id", "cart_items"]
            transitions:
              - to: "address_verification"
                condition: "cart_not_empty AND user_authenticated"
              - to: "payment_attempt"
                condition: "address_saved AND cart_not_empty"
            forbidden_transitions:
              - to: "order_confirmation"
                reason: "Cannot skip payment and address verification"
                
          - name: "address_verification"
            required_context: ["user_id", "shipping_address"]
            transitions:
              - to: "payment_attempt"
                condition: "address_valid"
            forbidden_transitions:
              - to: "order_confirmation"
                reason: "Cannot skip payment"
                
          - name: "payment_attempt"
            required_context: ["user_id", "payment_method", "payment_token"]
            transitions:
              - to: "payment_processing"
                condition: "payment_token_valid"
              - to: "payment_failed"
                condition: "payment_token_invalid"
            forbidden_transitions:
              - to: "order_confirmation"
                reason: "Must complete payment processing"
                
          - name: "payment_processing"
            required_context: ["user_id", "payment_confirmation"]
            transitions:
              - to: "order_confirmation"
                condition: "payment_successful"
              - to: "payment_failed"
                condition: "payment_declined"
                
          - name: "order_confirmation"
            required_context: ["user_id", "order_id", "payment_confirmation"]
            transitions:
              - to: "order_complete"
                condition: "inventory_reserved"
                
          - name: "order_complete"
            required_context: ["user_id", "order_id", "tracking_number"]
            
        epistemic_rules:
          - name: "payment_bypass_detection"
            description: "Detect attempts to reach order completion without payment"
            rule: "Implies(target_state == 'order_complete', Exists(previous_state == 'payment_processing') AND payment_successful == true)"
            severity: "critical"
            
          - name: "address_skip_detection"
            description: "Detect attempts to skip address verification"
            rule: "Implies(target_state == 'payment_attempt', Exists(previous_state == 'address_verification') OR address_saved == true)"
            severity: "high"
            
          - name: "cart_manipulation_after_payment"
            description: "Detect cart modification after payment initiation"
            rule: "Implies(current_state == 'payment_processing', cart_items_locked == true)"
            severity: "high"
            
    business_flow_templates:
      - name: "ecommerce_purchase"
        critical_steps: ["cart", "address_verification", "payment_processing", "order_confirmation"]
        abuse_patterns:
          - "skip_payment_step"
          - "manipulate_price_after_validation"
          - "exploite_race_conditions"
          - "bypass_inventory_checks"
          
      - name: "user_registration"
        critical_steps: ["email_verification", "password_setup", "profile_creation"]
        abuse_patterns:
          - "bulk_account_creation"
          - "email_verification_bypass"
          - "weak_password_acceptance"
          
      - name: "password_reset"
        critical_steps: ["identity_verification", "token_validation", "password_update"]
        abuse_patterns:
          - "token_enumeration"
          - "identity_verification_bypass"
          - "token_reuse"
          
  # API7: Server Side Request Forgery
  API7_2023_Server_Side_Request_Forgery:
    category: "Injection"
    severity: "critical"
    description: "API fetching remote resources without validating user-supplied URI"
    
    detection_rules:
      - name: "ssrf_detection"
        description: "Detect SSRF attempts via user-supplied URLs"
        z3_constraint: "Forall(user, url: Implies(api_fetch(user, url), url_whitelisted(url)))"
        ebpf_tracepoints:
          - "net_trace"
          - "http_request_trace"
          - "dns_trace"
        pattern: "external_resource_request"
        
      - name: "internal_network_access"
        description: "Detect attempts to access internal network resources"
        z3_constraint: "Implies(url_access(url), not(internal_network(url)))"
        ebpf_tracepoints:
          - "net_trace"
          - "dns_trace"
        pattern: "internal_ip_access"
        
  # API8: Security Misconfiguration
  API8_2023_Security_Misconfiguration:
    category: "Configuration"
    severity: "medium"
    description: "Complex configurations missed or not following security best practices"
    
    detection_rules:
      - name: "debug_endpoint_exposure"
        description: "Detect exposure of debug endpoints"
        z3_constraint: "Forall(endpoint: Implies(endpoint_accessible(endpoint), not(debug_endpoint(endpoint)))"
        ebpf_tracepoints:
          - "http_request_trace"
          - "net_trace"
        pattern: "debug_endpoint_access"
        
      - name: "verbose_error_messages"
        description: "Detect verbose error messages exposing sensitive information"
        z3_constraint: "Implies(error_response(response), not(contains_sensitive_info(response)))"
        ebpf_tracepoints:
          - "http_response_body"
          - "net_trace"
        pattern: "information_disclosure"
        
  # API9: Improper Inventory Management
  API9_2023_Improper_Inventory_Management:
    category: "Asset Management"
    severity: "medium"
    description: "Proper inventory of hosts and deployed API versions important for security"
    
    detection_rules:
      - name: "deprecated_api_access"
        description: "Detect access to deprecated API versions"
        z3_constraint: "Implies(api_version_access(version), not(deprecated(version)))"
        ebpf_tracepoints:
          - "http_request_headers"
          - "net_trace"
        pattern: "deprecated_version_usage"
        
      - name: "undocumented_endpoint_access"
        description: "Detect access to undocumented endpoints"
        z3_constraint: "Forall(endpoint: Implies(endpoint_access(endpoint), documented(endpoint)))"
        ebpf_tracepoints:
          - "http_request_trace"
          - "net_trace"
        pattern: "unknown_endpoint_access"
        
  # API10: Unsafe Consumption of APIs
  API10_2023_Unsafe_Consumption_of_APIs:
    category: "Integration"
    severity: "medium"
    description: "Developers trust APIs more than they should leading to security issues"
    
    detection_rules:
      - name: "insufficient_trust_validation"
        description: "Detect insufficient validation of data from external APIs"
        z3_constraint: "Forall(external_api, data: Implies(data_consumption(external_api, data), data_validated(data)))"
        ebpf_tracepoints:
          - "net_trace"
          - "http_response_body"
        pattern: "unvalidated_external_data"
        
      - name: "rate_limit_dependency_abuse"
        description: "Detect abuse of rate limits in external API dependencies"
        z3_constraint: "Implies(external_api_call(api), within_quota(api))"
        ebpf_tracepoints:
          - "net_trace"
          - "http_request_trace"
        pattern: "quota_exceeded"

# Global Z3 Constraint Templates
z3_constraint_templates:
  authorization_template: |
    Forall(user, resource, action:
      Implies(api_action(user, resource, action),
              And(authenticated(user), authorized(user, resource, action)))
    )
    
  state_transition_template: |
    Forall(state1, state2, user:
      Implies(state_transition(user, state1, state2),
              And(valid_transition(state1, state2),
                  user_authorized_for_transition(user, state1, state2)))
    )
    
  business_flow_template: |
    Forall(flow, user, steps:
      Implies(business_flow_completion(user, flow),
              And(steps_covered(user, flow, required_steps(flow)),
                  steps_in_valid_order(user, flow)))
    )

# eBPF Tracepoint Mappings
ebpf_tracepoint_mappings:
  http_request_headers:
    detection_capabilities:
      - "Authentication token analysis"
      - "Authorization header validation"
      - "API version detection"
      - "User agent analysis"
    
  http_request_body:
    detection_capabilities:
      - "Mass assignment detection"
      - "Parameter tampering"
      - "State variable manipulation"
      
  http_response_body:
    detection_capabilities:
      - "Sensitive data exposure"
      - "Verbose error message detection"
      - "Information disclosure"
      
  net_trace:
    detection_capabilities:
      - "Rate limiting violations"
      - "Network access patterns"
      - "SSRF detection"
      - "Internal network access"
      
  execve_trace:
    detection_capabilities:
      - "Command injection"
      - "System call abuse"
      - "Privilege escalation"
      
  file_trace:
    detection_capabilities:
      - "File system abuse"
      - "Unauthorized file access"
      - "Configuration file modification"
      
  file_write_trace:
    detection_capabilities:
      - "Unauthorized modifications"
      - "State persistence attacks"
      - "Configuration tampering"

# Business Logic State Machine Templates
business_logic_templates:
  general_principles:
    - "Always validate state transitions"
    - "Never trust client-side state"
    - "Implement proper authorization at each step"
    - "Log all state transitions for audit"
    - "Implement rate limiting on sensitive flows"
    
  validation_rules:
    - name: "sequential_validation"
      description: "Ensure critical steps are executed in proper order"
      rule: "Implies(state_reached(final_state), sequential_execution(required_states))"
      
    - name: "context_preservation"
      description: "Ensure required context is preserved across transitions"
      rule: "Implies(state_transition(s1, s2), And(context_preserved(s1), context_valid(s2)))"
      
    - name: "authorization_checkpoint"
      description: "Authorization checks at each critical state"
      rule: "Forall(state: Implies(critical_state(state), authorization_performed(state)))"

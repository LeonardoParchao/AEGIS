<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEGIS Security Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%); }
        .card-shadow { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        .pulse-animation { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .progress-bar { transition: width 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // API Base URL
        const API_BASE = 'http://localhost:5000/api';

        // Main App Component
        function App() {
            const [activeTab, setActiveTab] = useState('scan');
            const [scanHistory, setScanHistory] = useState([]);
            const [socket, setSocket] = useState(null);
            const [currentScan, setCurrentScan] = useState(null);
            const [scanProgress, setScanProgress] = useState(null);

            useEffect(() => {
                // Initialize Socket.IO connection
                const newSocket = io('http://localhost:5000');
                setSocket(newSocket);

                newSocket.on('connect', () => {
                    console.log('Connected to server');
                });

                newSocket.on('scan_progress', (data) => {
                    setScanProgress(data);
                });

                newSocket.on('scan_complete', (data) => {
                    console.log('Scan complete:', data);
                    loadScanHistory();
                    setScanProgress(null);
                    setCurrentScan(null);
                });

                newSocket.on('scan_error', (data) => {
                    console.error('Scan error:', data);
                    alert('Scan failed: ' + data.error);
                    setScanProgress(null);
                    setCurrentScan(null);
                });

                // Load initial scan history
                loadScanHistory();

                return () => {
                    newSocket.disconnect();
                };
            }, []);

            const loadScanHistory = useCallback(async () => {
                try {
                    const response = await fetch(`${API_BASE}/scan/history`);
                    const data = await response.json();
                    setScanHistory(data.scans || []);
                } catch (error) {
                    console.error('Failed to load scan history:', error);
                }
            }, []);

            const handleScanStart = (scanData) => {
                setCurrentScan(scanData);
                setActiveTab('progress');
            };

            return (
                <div className="min-h-screen gradient-bg">
                    {/* Header */}
                    <header className="bg-slate-800/50 backdrop-blur-sm border-b border-slate-700 sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between h-16">
                                <div className="flex items-center space-x-3">
                                    <div className="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center">
                                        <svg className="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                                        </svg>
                                    </div>
                                    <h1 className="text-xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">
                                        AEGIS Security Scanner
                                    </h1>
                                </div>
                                <nav className="flex space-x-1">
                                    {['scan', 'progress', 'results', 'history'].map((tab) => (
                                        <button
                                            key={tab}
                                            onClick={() => setActiveTab(tab)}
                                            className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${
                                                activeTab === tab
                                                    ? 'bg-blue-600 text-white'
                                                    : 'text-slate-300 hover:bg-slate-700 hover:text-white'
                                            }`}
                                        >
                                            {tab.charAt(0).toUpperCase() + tab.slice(1)}
                                        </button>
                                    ))}
                                </nav>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {activeTab === 'scan' && (
                            <ScanConfigPanel onScanStart={handleScanStart} />
                        )}
                        {activeTab === 'progress' && (
                            <ScanProgress 
                                currentScan={currentScan} 
                                progress={scanProgress}
                                onStop={() => setActiveTab('scan')}
                            />
                        )}
                        {activeTab === 'results' && (
                            <ResultsPanel scanHistory={scanHistory} />
                        )}
                        {activeTab === 'history' && (
                            <HistoryPanel scanHistory={scanHistory} onRefresh={loadScanHistory} />
                        )}
                    </main>
                </div>
            );
        }

        // Scan Configuration Panel
        function ScanConfigPanel({ onScanStart }) {
            const [targetType, setTargetType] = useState('openapi');
            const [target, setTarget] = useState('');
            const [scanType, setScanType] = useState('full');
            const [timeout, setTimeout] = useState(300);
            const [maxThreads, setMaxThreads] = useState(4);
            const [cognitiveDepth, setCognitiveDepth] = useState(3);
            const [enableFuzzing, setEnableFuzzing] = useState(true);
            const [enableVerification, setEnableVerification] = useState(true);
            const [validating, setValidating] = useState(false);
            const [validationResult, setValidationResult] = useState(null);
            const [starting, setStarting] = useState(false);

            const validateTarget = async () => {
                if (!target) return;
                
                setValidating(true);
                setValidationResult(null);
                
                try {
                    const response = await fetch(`${API_BASE}/target/validate`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ target_type: targetType, target })
                    });
                    const data = await response.json();
                    setValidationResult(data);
                } catch (error) {
                    setValidationResult({ valid: false, error: error.message });
                } finally {
                    setValidating(false);
                }
            };

            const startScan = async () => {
                if (!target) {
                    alert('Please provide a target');
                    return;
                }

                setStarting(true);
                
                try {
                    const response = await fetch(`${API_BASE}/scan/start`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            target_type: targetType,
                            target,
                            scan_type: scanType,
                            timeout,
                            max_threads: maxThreads,
                            cognitive_depth: cognitiveDepth,
                            enable_fuzzing: enableFuzzing,
                            enable_verification: enableVerification
                        })
                    });
                    const data = await response.json();
                    
                    if (response.ok) {
                        onScanStart({
                            scan_id: data.scan_id,
                            target,
                            target_type: targetType,
                            config: { scanType, timeout, maxThreads, cognitiveDepth }
                        });
                    } else {
                        alert('Failed to start scan: ' + data.error);
                    }
                } catch (error) {
                    alert('Failed to start scan: ' + error.message);
                } finally {
                    setStarting(false);
                }
            };

            return (
                <div className="space-y-6">
                    <div className="text-center mb-8">
                        <h2 className="text-3xl font-bold text-white mb-2">Configure Security Scan</h2>
                        <p className="text-slate-400">Set up your target and scan parameters</p>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        {/* Target Configuration */}
                        <div className="bg-slate-800/50 backdrop-blur-sm rounded-xl p-6 card-shadow border border-slate-700">
                            <h3 className="text-lg font-semibold mb-4 flex items-center">
                                <svg className="w-5 h-5 mr-2 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                </svg>
                                Target Configuration
                            </h3>
                            
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-slate-300 mb-2">Target Type</label>
                                    <select
                                        value={targetType}
                                        onChange={(e) => { setTargetType(e.target.value); setValidationResult(null); }}
                                        className="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2.5 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    >
                                        <option value="openapi">OpenAPI Specification</option>
                                        <option value="pcap">PCAP Network Capture</option>
                                        <option value="url">Direct URL</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-slate-300 mb-2">
                                        {targetType === 'openapi' ? 'OpenAPI Spec Path' : 
                                         targetType === 'pcap' ? 'PCAP File Path' : 'Target URL'}
                                    </label>
                                    <div className="flex space-x-2">
                                        <input
                                            type="text"
                                            value={target}
                                            onChange={(e) => { setTarget(e.target.value); setValidationResult(null); }}
                                            placeholder={targetType === 'openapi' ? '/path/to/api.yaml' : 
                                                       targetType === 'pcap' ? '/path/to/capture.pcap' : 'https://api.example.com'}
                                            className="flex-1 bg-slate-700 border border-slate-600 rounded-lg px-4 py-2.5 text-white placeholder-slate-400 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        />
                                        <button
                                            onClick={validateTarget}
                                            disabled={validating || !target}
                                            className="px-4 py-2.5 bg-slate-600 hover:bg-slate-500 disabled:bg-slate-700 rounded-lg text-white font-medium transition-colors"
                                        >
                                            {validating ? 'Validating...' : 'Validate'}
                                        </button>
                                    </div>
                                </div>

                                {validationResult && (
                                    <div className={`p-3 rounded-lg ${validationResult.valid ? 'bg-green-900/30 border border-green-700' : 'bg-red-900/30 border border-red-700'}`}>
                                        {validationResult.valid ? (
                                            <div className="text-green-400 text-sm">
                                                ✓ Target is valid
                                                {validationResult.spec_info && (
                                                    <div className="mt-1 text-slate-300">
                                                        {validationResult.spec_info.title} - {validationResult.spec_info.endpoints_count} endpoints
                                                    </div>
                                                )}
                                                {validationResult.pcap_info && (
                                                    <div className="mt-1 text-slate-300">
                                                        {validationResult.pcap_info.total_packets} packets, {validationResult.pcap_info.network_flows} flows
                                                    </div>
                                                )}
                                            </div>
                                        ) : (
                                            <div className="text-red-400 text-sm">
                                                ✗ {validationResult.error || 'Invalid target'}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Scan Configuration */}
                        <div className="bg-slate-800/50 backdrop-blur-sm rounded-xl p-6 card-shadow border border-slate-700">
                            <h3 className="text-lg font-semibold mb-4 flex items-center">
                                <svg className="w-5 h-5 mr-2 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                                Scan Configuration
                            </h3>
                            
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-slate-300 mb-2">Scan Type</label>
                                    <select
                                        value={scanType}
                                        onChange={(e) => setScanType(e.target.value)}
                                        className="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2.5 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    >
                                        <option value="full">Full Scan</option>
                                        <option value="quick">Quick Scan</option>
                                        <option value="custom">Custom Scan</option>
                                    </select>
                                </div>

                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-medium text-slate-300 mb-2">Timeout (seconds)</label>
                                        <input
                                            type="number"
                                            value={timeout}
                                            onChange={(e) => setTimeout(parseInt(e.target.value))}
                                            min="30"
                                            max="3600"
                                            className="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2.5 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-slate-300 mb-2">Max Threads</label>
                                        <input
                                            type="number"
                                            value={maxThreads}
                                            onChange={(e) => setMaxThreads(parseInt(e.target.value))}
                                            min="1"
                                            max="16"
                                            className="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2.5 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        />
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-slate-300 mb-2">Cognitive Depth: {cognitiveDepth}</label>
                                    <input
                                        type="range"
                                        value={cognitiveDepth}
                                        onChange={(e) => setCognitiveDepth(parseInt(e.target.value))}
                                        min="1"
                                        max="5"
                                        className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer"
                                    />
                                    <div className="flex justify-between text-xs text-slate-400 mt-1">
                                        <span>Basic</span>
                                        <span>Deep</span>
                                    </div>
                                </div>

                                <div className="space-y-2">
                                    <label className="flex items-center space-x-3 cursor-pointer">
                                        <input
                                            type="checkbox"
                                            checked={enableFuzzing}
                                            onChange={(e) => setEnableFuzzing(e.target.checked)}
                                            className="w-4 h-4 rounded border-slate-600 text-blue-600 focus:ring-blue-500 bg-slate-700"
                                        />
                                        <span className="text-sm text-slate-300">Enable Fuzzing</span>
                                    </label>
                                    <label className="flex items-center space-x-3 cursor-pointer">
                                        <input
                                            type="checkbox"
                                            checked={enableVerification}
                                            onChange={(e) => setEnableVerification(e.target.checked)}
                                            className="w-4 h-4 rounded border-slate-600 text-blue-600 focus:ring-blue-500 bg-slate-700"
                                        />
                                        <span className="text-sm text-slate-300">Enable Verification</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Start Button */}
                    <div className="flex justify-center">
                        <button
                            onClick={startScan}
                            disabled={starting || !target || (validationResult && !validationResult.valid)}
                            className="px-8 py-3 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 disabled:from-slate-600 disabled:to-slate-600 rounded-xl text-white font-semibold text-lg transition-all transform hover:scale-105 disabled:transform-none disabled:cursor-not-allowed shadow-lg"
                        >
                            {starting ? (
                                <span className="flex items-center">
                                    <svg className="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                    </svg>
                                    Starting Scan...
                                </span>
                            ) : 'Start Security Scan'}
                        </button>
                    </div>
                </div>
            );
        }

        // Scan Progress Panel
        function ScanProgress({ currentScan, progress, onStop }) {
            const [stopping, setStopping] = useState(false);

            const stopScan = async () => {
                setStopping(true);
                try {
                    await fetch(`${API_BASE}/scan/stop`, { method: 'POST' });
                } catch (error) {
                    console.error('Failed to stop scan:', error);
                } finally {
                    setStopping(false);
                    onStop();
                }
            };

            const getPhaseProgress = (phase) => {
                const phases = ['initialization', 'ingestion', 'analysis', 'fuzzing', 'verification', 'reporting', 'completed'];
                const currentIndex = phases.indexOf(progress?.phase || 'initialization');
                const phaseIndex = phases.indexOf(phase);
                if (phaseIndex < currentIndex) return 100;
                if (phaseIndex === currentIndex) return 50;
                return 0;
            };

            if (!currentScan) {
                return (
                    <div className="text-center py-12">
                        <div className="text-slate-400 text-lg">No active scan</div>
                        <button onClick={onStop} className="mt-4 text-blue-400 hover:text-blue-300">
                            Configure new scan
                        </button>
                    </div>
                );
            }

            return (
                <div className="space-y-6">
                    <div className="text-center mb-8">
                        <h2 className="text-3xl font-bold text-white mb-2">Scan in Progress</h2>
                        <p className="text-slate-400">{currentScan.target}</p>
                    </div>

                    {/* Current Status */}
                    <div className="bg-slate-800/50 backdrop-blur-sm rounded-xl p-6 card-shadow border border-slate-700">
                        <div className="flex items-center justify-between mb-4">
                            <h3 className="text-lg font-semibold">Current Phase</h3>
                            <span className="px-3 py-1 bg-blue-600 rounded-full text-sm font-medium pulse-animation">
                                {progress?.phase || 'Initializing'}
                            </span>
                        </div>

                        {/* Progress Steps */}
                        <div className="space-y-3">
                            {['initialization', 'ingestion', 'analysis', 'fuzzing', 'verification', 'reporting'].map((phase) => (
                                <div key={phase} className="flex items-center space-x-3">
                                    <div className={`w-8 h-8 rounded-full flex items-center justify-center ${
                                        getPhaseProgress(phase) === 100 ? 'bg-green-600' :
                                        getPhaseProgress(phase) === 50 ? 'bg-blue-600 pulse-animation' : 'bg-slate-600'
                                    }`}>
                                        {getPhaseProgress(phase) === 100 ? (
                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
                                            </svg>
                                        ) : getPhaseProgress(phase) === 50 ? (
                                            <svg className="animate-spin w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                            </svg>
                                        ) : (
                                            <div className="w-2 h-2 bg-slate-400 rounded-full" />
                                        )}
                                    </div>
                                    <div className="flex-1">
                                        <div className="flex justify-between text-sm mb-1">
                                            <span className="text-slate-300">{phase.charAt(0).toUpperCase() + phase.slice(1)}</span>
                                        </div>
                                        <div className="h-2 bg-slate-700 rounded-full overflow-hidden">
                                            <div 
                                                className="h-full bg-gradient-to-r from-blue-500 to-purple-500 progress-bar"
                                                style={{ width: `${getPhaseProgress(phase)}%` }}
                                            />
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Statistics */}
                    <div className="grid grid-cols-3 gap-4">
                        <div className="bg-slate-800/50 backdrop-blur-sm rounded-xl p-4 card-shadow border border-slate-700 text-center">
                            <div className="text-3xl font-bold text-blue-400">{progress?.endpoints_tested || 0}</div>
                            <div className="text-sm text-slate-400 mt-1">Endpoints Tested</div>
                        </div>
                        <div className="bg-slate-800/50 backdrop-blur-sm rounded-xl p-4 card-shadow border border-slate-700 text-center">
                            <div className="text-3xl font-bold text-purple-400">{progress?.payloads_generated || 0}</div>
                            <div className="text-sm text-slate-400 mt-1">Payloads Generated</div>
                        </div>
                        <div className="bg-slate-800/50 backdrop-blur-sm rounded-xl p-4 card-shadow border border-slate-700 text-center">
                            <div className="text-3xl font-bold text-red-400">{progress?.vulnerabilities_found || 0}</div>
                            <div className="text-sm text-slate-400 mt-1">Vulnerabilities Found</div>
                        </div>
                    </div>

                    {/* Errors */}
                    {progress?.errors && progress.errors.length > 0 && (
                        <div className="bg-red-900/30 backdrop-blur-sm rounded-xl p-4 border border-red-700">
                            <h4 className="text-red-400 font-semibold mb-2">Errors</h4>
                            <ul className="text-red-300 text-sm space-y-1">
                                {progress.errors.map((error, i) => (
                                    <li key={i}>• {error}</li>
                                ))}
                            </ul>
                        </div>
                    )}

                    {/* Stop Button */}
                    <div className="flex justify-center">
                        <button
                            onClick={stopScan}
                            disabled={stopping}
                            className="px-6 py-2 bg-red-600 hover:bg-red-700 disabled:bg-slate-600 rounded-lg text-white font-medium transition-colors"
                        >
                            {stopping ? 'Stopping...' : 'Stop Scan'}
                        </button>
                    </div>
                </div>
            );
        }

        // Results Panel
        function ResultsPanel({ scanHistory }) {
            const [selectedScan, setSelectedScan] = useState(null);
            const [loading, setLoading] = useState(false);
            const [results, setResults] = useState(null);

            const loadResults = async (scanId) => {
                setLoading(true);
                try {
                    const response = await fetch(`${API_BASE}/scan/results?scan_id=${scanId}`);
                    const data = await response.json();
                    setResults(data);
                } catch (error) {
                    console.error('Failed to load results:', error);
                } finally {
                    setLoading(false);
                }
            };

            const exportReport = async (scanId, format) => {
                try {
                    const response = await fetch(`${API_BASE}/scan/${scanId}/export?format=${format}`);
                    if (format === 'json') {
                        const data = await response.json();
                        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `aegis_report_${scanId}.json`;
                        a.click();
                    } else {
                        const text = await response.text();
                        const blob = new Blob([text], { type: `text/${format}` });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `aegis_report_${scanId}.${format}`;
                        a.click();
                    }
                } catch (error) {
                    console.error('Failed to export report:', error);
                }
            };

            const completedScans = scanHistory.filter(s => s.status === 'completed');

            return (
                <div className="space-y-6">
                    <div className="text-center mb-8">
                        <h2 className="text-3xl font-bold text-white mb-2">Scan Results</h2>
                        <p className="text-slate-400">View detailed vulnerability reports</p>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* Scan List */}
                        <div className="bg-slate-800/50 backdrop-blur-sm rounded-xl p-4 card-shadow border border-slate-700">
                            <h3 className="text-lg font-semibold mb-4">Completed Scans</h3>
                            <div className="space-y-2 max-h-96 overflow-y-auto">
                                {completedScans.length === 0 ? (
                                    <div className="text-slate-400 text-center py-8">No completed scans</div>
                                ) : (
                                    completedScans.map((scan) => (
                                        <button
                                            key={scan.scan_id}
                                            onClick={() => { setSelectedScan(scan); loadResults(scan.scan_id); }}
                                            className={`w-full text-left p-3 rounded-lg transition-colors ${
                                                selectedScan?.scan_id === scan.scan_id
                                                    ? 'bg-blue-600'
                                                    : 'bg-slate-700 hover:bg-slate-600'
                                            }`}
                                        >
                                            <div className="font-medium text-sm truncate">{scan.target}</div>
                                            <div className="text-xs text-slate-300 mt-1">
                                                {new Date(scan.start_time).toLocaleString()}
                                            </div>
                                        </button>
                                    ))
                                )}
                            </div>
                        </div>

                        {/* Results Detail */}
                        <div className="lg:col-span-2 bg-slate-800/50 backdrop-blur-sm rounded-xl p-6 card-shadow border border-slate-700">
                            {loading ? (
                                <div className="text-center py-12">
                                    <div className="animate-spin w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full mx-auto"></div>
                                    <div className="text-slate-400 mt-4">Loading results...</div>
                                </div>
                            ) : results ? (
                                <div className="space-y-6">
                                    <div className="flex justify-between items-start">
                                        <div>
                                            <h3 className="text-xl font-semibold">{selectedScan?.target}</h3>
                                            <p className="text-slate-400 text-sm mt-1">
                                                {new Date(selectedScan?.start_time).toLocaleString()}
                                            </p>
                                        </div>
                                        <div className="flex space-x-2">
                                            <button
                                                onClick={() => exportReport(selectedScan?.scan_id, 'json')}
                                                className="px-3 py-1.5 bg-slate-600 hover:bg-slate-500 rounded-lg text-sm"
                                            >
                                                JSON
                                            </button>
                                            <button
                                                onClick={() => exportReport(selectedScan?.scan_id, 'html')}
                                                className="px-3 py-1.5 bg-slate-600 hover:bg-slate-500 rounded-lg text-sm"
                                            >
                                                HTML
                                            </button>
                                            <button
                                                onClick={() => exportReport(selectedScan?.scan_id, 'markdown')}
                                                className="px-3 py-1.5 bg-slate-600 hover:bg-slate-500 rounded-lg text-sm"
                                            >
                                                MD
                                            </button>
                                        </div>
                                    </div>

                                    {/* Summary Stats */}
                                    <div className="grid grid-cols-4 gap-4">
                                        <div className="bg-slate-700/50 rounded-lg p-3 text-center">
                                            <div className="text-2xl font-bold text-blue-400">{results.endpoints_tested}</div>
                                            <div className="text-xs text-slate-400">Endpoints</div>
                                        </div>
                                        <div className="bg-slate-700/50 rounded-lg p-3 text-center">
                                            <div className="text-2xl font-bold text-purple-400">{results.payloads_generated}</div>
                                            <div className="text-xs text-slate-400">Payloads</div>
                                        </div>
                                        <div className="bg-slate-700/50 rounded-lg p-3 text-center">
                                            <div className="text-2xl font-bold text-red-400">{results.vulnerabilities.length}</div>
                                            <div className="text-xs text-slate-400">Vulnerabilities</div>
                                        </div>
                                        <div className="bg-slate-700/50 rounded-lg p-3 text-center">
                                            <div className="text-2xl font-bold text-green-400">
                                                {results.vulnerabilities.filter(v => v.verified).length}
                                            </div>
                                            <div className="text-xs text-slate-400">Verified</div>
                                        </div>
                                    </div>

                                    {/* Vulnerabilities */}
                                    <div>
                                        <h4 className="font-semibold mb-3">Vulnerabilities</h4>
                                        <div className="space-y-3 max-h-96 overflow-y-auto">
                                            {results.vulnerabilities.length === 0 ? (
                                                <div className="text-slate-400 text-center py-8">No vulnerabilities found</div>
                                            ) : (
                                                results.vulnerabilities.map((vuln, i) => (
                                                    <div key={i} className="bg-slate-700/50 rounded-lg p-4 border-l-4 border-red-500">
                                                        <div className="flex justify-between items-start mb-2">
                                                            <h5 className="font-medium">{vuln.title}</h5>
                                                            <span className={`px-2 py-0.5 rounded text-xs font-medium ${
                                                                vuln.severity === 'critical' ? 'bg-red-600' :
                                                                vuln.severity === 'high' ? 'bg-orange-600' :
                                                                vuln.severity === 'medium' ? 'bg-yellow-600' : 'bg-green-600'
                                                            }`}>
                                                                {vuln.severity.toUpperCase()}
                                                            </span>
                                                        </div>
                                                        <p className="text-sm text-slate-300 mb-2">{vuln.description}</p>
                                                        <div className="flex items-center space-x-4 text-xs text-slate-400">
                                                            <span>CVSS: {vuln.cvss_score}</span>
                                                            <span>{vuln.verified ? '✓ Verified' : 'Unverified'}</span>
                                                            {vuln.cve_matches && vuln.cve_matches.length > 0 && (
                                                                <span>CVE: {vuln.cve_matches.length} matches</span>
                                                            )}
                                                        </div>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="text-center py-12 text-slate-400">
                                    Select a scan to view results
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // History Panel
        function HistoryPanel({ scanHistory, onRefresh }) {
            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center mb-8">
                        <div>
                            <h2 className="text-3xl font-bold text-white mb-2">Scan History</h2>
                            <p className="text-slate-400">All past scans and their status</p>
                        </div>
                        <button
                            onClick={onRefresh}
                            className="px-4 py-2 bg-slate-600 hover:bg-slate-500 rounded-lg text-white font-medium transition-colors"
                        >
                            Refresh
                        </button>
                    </div>

                    <div className="bg-slate-800/50 backdrop-blur-sm rounded-xl card-shadow border border-slate-700 overflow-hidden">
                        <table className="w-full">
                            <thead className="bg-slate-700/50">
                                <tr>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-slate-300 uppercase tracking-wider">Target</th>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-slate-300 uppercase tracking-wider">Type</th>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-slate-300 uppercase tracking-wider">Status</th>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-slate-300 uppercase tracking-wider">Start Time</th>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-slate-300 uppercase tracking-wider">Vulnerabilities</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-700">
                                {scanHistory.length === 0 ? (
                                    <tr>
                                        <td colSpan="5" className="px-6 py-12 text-center text-slate-400">
                                            No scan history available
                                        </td>
                                    </tr>
                                ) : (
                                    scanHistory.map((scan) => (
                                        <tr key={scan.scan_id} className="hover:bg-slate-700/30">
                                            <td className="px-6 py-4 whitespace-nowrap text-sm text-white">{scan.target}</td>
                                            <td className="px-6 py-4 whitespace-nowrap text-sm text-slate-300">{scan.target_type}</td>
                                            <td className="px-6 py-4 whitespace-nowrap">
                                                <span className={`px-2 py-1 rounded-full text-xs font-medium ${
                                                    scan.status === 'completed' ? 'bg-green-600' :
                                                    scan.status === 'failed' ? 'bg-red-600' :
                                                    scan.status === 'starting' ? 'bg-blue-600' : 'bg-yellow-600'
                                                }`}>
                                                    {scan.status}
                                                </span>
                                            </td>
                                            <td className="px-6 py-4 whitespace-nowrap text-sm text-slate-300">
                                                {new Date(scan.start_time).toLocaleString()}
                                            </td>
                                            <td className="px-6 py-4 whitespace-nowrap text-sm text-white">
                                                {scan.result?.vulnerabilities?.length || 0}
                                            </td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

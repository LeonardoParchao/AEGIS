# OWASP Top 10 Security Risk Detection Rules
# Version: 1.0.0
# Focus: OWASP Top 10 2021 Security Risks
# Maps OWASP Top 10 risks to Z3 constraints, eBPF tracepoints, and state machine rules

owasp_top10:
  version: "2021"
  description: "Detection rules for OWASP Top 10 2021"
  
  # A01:2021 - Broken Access Control
  A01_2021_Broken_Access_Control:
    category: "Access Control"
    severity: "critical"
    description: "Restrictions on what authenticated users are allowed to do are often not properly enforced"
    
    detection_rules:
      - name: "vertical_privilege_escalation"
        description: "Detect attempts to access higher-privilege functions"
        z3_constraint: "Forall(user, resource: Implies(access_attempt(user, resource), has_permission(user, resource)))"
        ebpf_tracepoints:
          - "execve_trace"
          - "file_access_trace"
          - "http_request_trace"
        pattern: "unauthorized_admin_access"
        
      - name: "horizontal_privilege_escalation"
        description: "Detect attempts to access other users' data"
        z3_constraint: "Forall(user1, user2, resource: Implies(access_attempt(user1, resource, user2), same_tenant(user1, user2)))"
        ebpf_tracepoints:
          - "http_request_trace"
          - "net_trace"
          - "file_read_trace"
        pattern: "cross_user_data_access"
        
      - name: "id_oracle_enumeration"
        description: "Detect sequential ID enumeration attacks"
        z3_constraint: "Implies(sequence_of_requests(user, id1, id2, id3), And(abs(id2-id1)==1, abs(id3-id2)==1))"
        ebpf_tracepoints:
          - "net_trace"
          - "http_request_trace"
        pattern: "sequential_id_enumeration"
        
      - name: "path_traversal"
        description: "Detect directory traversal attempts"
        z3_constraint: "Implies(file_access(path), not_contains(path, '../') AND not_contains(path, '..\\'))"
        ebpf_tracepoints:
          - "file_access_trace"
          - "execve_trace"
          - "http_request_trace"
        pattern: "path_traversal_attempt"
        
      - name: "missing_authorization"
        description: "Detect access to protected endpoints without authorization checks"
        z3_constraint: "Forall(endpoint, request: Implies(protected_endpoint(endpoint), authorization_checked(request)))"
        ebpf_tracepoints:
          - "http_request_trace"
          - "execve_trace"
        pattern: "unprotected_endpoint_access"
        
    state_machine_rules:
      - name: "access_control_flow"
        initial_state: "unauthenticated"
        states:
          - name: "unauthenticated"
            transitions:
              - to: "authenticated"
                condition: "valid_credentials"
          - name: "authenticated"
            transitions:
              - to: "authorized_access"
                condition: "permission_granted"
              - to: "access_denied"
                condition: "Not(permission_granted)"
          - name: "authorized_access"
            transitions:
              - to: "resource_access"
                condition: "resource_authorized"
        violation_detection:
          - "Direct transition to resource_access without authentication"
          - "Access to protected resources without permission verification"
          
  # A02:2021 - Cryptographic Failures
  A02_2021_Cryptographic_Failures:
    category: "Cryptography"
    severity: "critical"
    description: "Failures related to cryptography leading to exposure of sensitive information"
    
    detection_rules:
      - name: "weak_cipher_usage"
        description: "Detect usage of weak cryptographic algorithms"
        z3_constraint: "Forall(algorithm: Implies(crypto_usage(algorithm), algorithm in secure_algorithms))"
        ebpf_tracepoints:
          - "execve_trace"
          - "net_trace"
          - "file_read_trace"
        pattern: "weak_encryption_algorithm"
        
      - name: "plaintext_transmission"
        description: "Detect transmission of sensitive data over unencrypted channels"
        z3_constraint: "Implies(data_transmission(data, sensitive), channel_encrypted(channel))"
        ebpf_tracepoints:
          - "net_trace"
          - "http_request_trace"
        pattern: "sensitive_data_plaintext"
        
      - name: "hardcoded_keys"
        description: "Detect hardcoded cryptographic keys in code or configuration"
        z3_constraint: "Forall(file, content: Implies(file_contains_crypto_key(file), file_not_in_secure_storage(file)))"
        ebpf_tracepoints:
          - "file_read_trace"
          - "execve_trace"
        pattern: "hardcoded_secret_detected"
        
      - name: "insufficient_key_length"
        description: "Detect usage of cryptographic keys with insufficient length"
        z3_constraint: "Forall(key: Implies(crypto_key_usage(key), key_length(key) >= minimum_required_length))"
        ebpf_tracepoints:
          - "execve_trace"
          - "net_trace"
        pattern: "weak_key_length"
        
      - name: "invalid_certificate_chain"
        description: "Detect invalid or self-signed SSL/TLS certificates"
        z3_constraint: "Implies(ssl_connection(cert), certificate_valid(cert) AND certificate_chain_trusted(cert))"
        ebpf_tracepoints:
          - "net_trace"
          - "execve_trace"
        pattern: "invalid_ssl_certificate"
        
  # A03:2021 - Injection
  A03_2021_Injection:
    category: "Injection"
    severity: "critical"
    description: "Injection vulnerabilities including SQL, NoSQL, OS command, and LDAP injection"
    
    detection_rules:
      - name: "sql_injection"
        description: "Detect SQL injection attempts"
        z3_constraint: "Forall(query, input: Implies(query_construction(query, input), query_sanitized(input) OR parameterized_query(query)))"
        ebpf_tracepoints:
          - "execve_trace"
          - "net_trace"
          - "http_request_trace"
        pattern: "sql_injection_pattern"
        
      - name: "command_injection"
        description: "Detect OS command injection attempts"
        z3_constraint: "Forall(command, input: Implies(command_execution(command, input), input_sanitized(input) AND input_not_contain_shell_metachars(input)))"
        ebpf_tracepoints:
          - "execve_trace"
          - "file_access_trace"
          - "http_request_trace"
        pattern: "command_injection_attempt"
        
      - name: "ldap_injection"
        description: "Detect LDAP injection attempts"
        z3_constraint: "Forall(query, input: Implies(ldap_query(query, input), input_escaped(input) AND input_not_contain_ldap_metachars(input)))"
        ebpf_tracepoints:
          - "net_trace"
          - "http_request_trace"
        pattern: "ldap_injection_pattern"
        
      - name: "nosql_injection"
        description: "Detect NoSQL injection attempts"
        z3_constraint: "Forall(query, input: Implies(nosql_query(query, input), input_sanitized(input) AND input_not_contain_nosql_operators(input)))"
        ebpf_tracepoints:
          - "net_trace"
          - "http_request_trace"
          - "execve_trace"
        pattern: "nosql_injection_pattern"
        
      - name: "xss_attack"
        description: "Detect Cross-Site Scripting (XSS) attempts"
        z3_constraint: "Forall(output, input: Implies(output_generation(output, input), output_escaped(output) AND content_type_security_headers(output)))"
        ebpf_tracepoints:
          - "http_request_trace"
          - "http_response_body"
          - "net_trace"
        pattern: "xss_injection_attempt"
        
    state_machine_rules:
      - name: "injection_attack_flow"
        initial_state: "input_received"
        states:
          - name: "input_received"
            transitions:
              - to: "validation"
                condition: "input_not_empty"
          - name: "validation"
            transitions:
              - to: "sanitization"
                condition: "input_validated"
              - to: "blocked"
                condition: "Not(input_validated)"
          - name: "sanitization"
            transitions:
              - to: "safe_execution"
                condition: "input_sanitized"
              - to: "blocked"
                condition: "Not(input_sanitized)"
        violation_detection:
          - "Direct execution without validation"
          - "Direct execution without sanitization"
          
  # A04:2021 - Insecure Design
  A04_2021_Insecure_Design:
    category: "Design"
    severity: "high"
    description: "Design flaws that lead to security vulnerabilities"
    
    detection_rules:
      - name: "missing_rate_limiting"
        description: "Detect absence of rate limiting on sensitive endpoints"
        z3_constraint: "Forall(endpoint: Implies(sensitive_endpoint(endpoint), rate_limiting_implemented(endpoint)))"
        ebpf_tracepoints:
          - "net_trace"
          - "http_request_trace"
        pattern: "no_rate_limiting"
        
      - name: "insecure_default_config"
        description: "Detect usage of insecure default configurations"
        z3_constraint: "Forall(config: Implies(default_config(config), config_secure(config)))"
        ebpf_tracepoints:
          - "file_read_trace"
          - "execve_trace"
        pattern: "insecure_default_settings"
        
      - name: "lack_of_input_validation"
        description: "Detect missing input validation mechanisms"
        z3_constraint: "Forall(input, endpoint: Implies(input_received(input, endpoint), input_validated(input)))"
        ebpf_tracepoints:
          - "http_request_trace"
          - "net_trace"
        pattern: "missing_input_validation"
        
      - name: "excessive_data_exposure"
        description: "Detect APIs returning more data than necessary"
        z3_constraint: "Forall(response, request: Implies(api_response(response, request), response_data_minimal(response, request)))"
        ebpf_tracepoints:
          - "http_response_body"
          - "net_trace"
        pattern: "excessive_data_returned"
        
  # A05:2021 - Security Misconfiguration
  A05_2021_Security_Misconfiguration:
    category: "Configuration"
    severity: "high"
    description: "Improperly configured security settings leading to vulnerabilities"
    
    detection_rules:
      - name: "default_credentials"
        description: "Detect usage of default credentials"
        z3_constraint: "Forall(auth: Implies(authentication_attempt(auth), not_default_credentials(auth)))"
        ebpf_tracepoints:
          - "http_request_trace"
          - "net_trace"
          - "execve_trace"
        pattern: "default_username_password"
        
      - name: "verbose_error_messages"
        description: "Detect exposure of sensitive information in error messages"
        z3_constraint: "Forall(error: Implies(error_generated(error), not_contains_sensitive_info(error)))"
        ebpf_tracepoints:
          - "http_response_body"
          - "file_write_trace"
        pattern: "sensitive_error_details"
        
      - name: "unnecessary_features"
        description: "Detect enabled unnecessary services or features"
        z3_constraint: "Forall(service: Implies(service_enabled(service), service_required(service)))"
        ebpf_tracepoints:
          - "execve_trace"
          - "net_trace"
          - "file_access_trace"
        pattern: "unnecessary_service_running"
        
      - name: "open_cloud_storage"
        description: "Detect publicly accessible cloud storage buckets"
        z3_constraint: "Forall(storage: Implies(cloud_storage(storage), access_restricted(storage)))"
        ebpf_tracepoints:
          - "net_trace"
          - "file_access_trace"
        pattern: "public_cloud_storage"
        
      - name: "missing_security_headers"
        description: "Detect missing security HTTP headers"
        z3_constraint: "Forall(response: Implies(http_response(response), contains_security_headers(response)))"
        ebpf_tracepoints:
          - "http_response_body"
          - "net_trace"
        pattern: "missing_security_headers"
        
  # A06:2021 - Vulnerable and Outdated Components
  A06_2021_Vulnerable_and_Outdated_Components:
    category: "Components"
    severity: "high"
    description: "Usage of components with known vulnerabilities"
    
    detection_rules:
      - name: "known_cve_dependency"
        description: "Detect dependencies with known CVEs"
        z3_constraint: "Forall(dependency: Implies(dependency_used(dependency), not_has_known_cve(dependency)))"
        ebpf_tracepoints:
          - "file_read_trace"
          - "execve_trace"
          - "net_trace"
        pattern: "vulnerable_dependency_detected"
        
      - name: "outdated_software_version"
        description: "Detect usage of outdated software versions"
        z3_constraint: "Forall(software: Implies(software_used(software), version_current(software) AND version_supported(software)))"
        ebpf_tracepoints:
          - "execve_trace"
          - "file_read_trace"
        pattern: "outdated_software_version"
        
      - name: "unsupported_components"
        description: "Detect usage of unsupported or end-of-life components"
        z3_constraint: "Forall(component: Implies(component_used(component), component_supported(component)))"
        ebpf_tracepoints:
          - "execve_trace"
          - "file_access_trace"
        pattern: "unsupported_component_usage"
        
      - name: "dependency_confusion"
        description: "Detect potential dependency confusion attacks"
        z3_constraint: "Forall(package: Implies(package_imported(package), package_from_trusted_source(package)))"
        ebpf_tracepoints:
          - "execve_trace"
          - "net_trace"
          - "file_read_trace"
        pattern: "untrusted_package_source"
        
  # A07:2021 - Identification and Authentication Failures
  A07_2021_Identification_and_Authentication_Failures:
    category: "Authentication"
    severity: "critical"
    description: "Weaknesses in user identification and authentication"
    
    detection_rules:
      - name: "weak_password_policy"
        description: "Detect weak password requirements"
        z3_constraint: "Forall(password: Implies(password_created(password), password_strength_sufficient(password)))"
        ebpf_tracepoints:
          - "http_request_trace"
          - "file_write_trace"
        pattern: "weak_password_accepted"
        
      - name: "credential_stuffing"
        description: "Detect automated credential stuffing attacks"
        z3_constraint: "Implies(failed_auth_attempts(user, count), count < threshold AND rate_limited(user))"
        ebpf_tracepoints:
          - "net_trace"
          - "http_request_trace"
        pattern: "high_failed_auth_rate"
        
      - name: "session_fixation"
        description: "Detect session fixation vulnerabilities"
        z3_constraint: "Implies(session_creation(session), session_regenerated_on_auth(session) AND session_id_random(session))"
        ebpf_tracepoints:
          - "http_request_trace"
          - "http_response_body"
          - "net_trace"
        pattern: "session_not_regenerated"
        
      - name: "missing_multifactor_auth"
        description: "Detect absence of multi-factor authentication for sensitive operations"
        z3_constraint: "Forall(operation: Implies(sensitive_operation(operation), mfa_required(operation) AND mfa_verified(operation)))"
        ebpf_tracepoints:
          - "http_request_trace"
          - "execve_trace"
        pattern: "sensitive_op_without_mfa"
        
      - name: "password_in_transit"
        description: "Detect password transmission over unencrypted channels"
        z3_constraint: "Implies(password_transmission(password), channel_encrypted(channel))"
        ebpf_tracepoints:
          - "net_trace"
          - "http_request_trace"
        pattern: "plaintext_password_transmission"
        
    state_machine_rules:
      - name: "authentication_flow"
        initial_state: "unauthenticated"
        states:
          - name: "unauthenticated"
            transitions:
              - to: "credential_verification"
                condition: "credentials_provided"
          - name: "credential_verification"
            transitions:
              - to: "mfa_verification"
                condition: "credentials_valid"
              - to: "auth_failed"
                condition: "Not(credentials_valid)"
          - name: "mfa_verification"
            transitions:
              - to: "authenticated"
                condition: "mfa_verified"
              - to: "auth_failed"
                condition: "Not(mfa_verified)"
          - name: "authenticated"
            transitions:
              - to: "session_established"
                condition: "session_created"
        violation_detection:
          - "Direct transition to authenticated without credential verification"
          - "Sensitive operation access without MFA verification"
          
  # A08:2021 - Software and Data Integrity Failures
  A08_2021_Software_and_Data_Integrity_Failures:
    category: "Integrity"
    severity: "high"
    description: "Code and infrastructure without integrity verification"
    
    detection_rules:
      - name: "insecure_deserialization"
        description: "Detect insecure deserialization of untrusted data"
        z3_constraint: "Forall(data: Implies(deserialization_attempt(data), data_trusted(data) OR deserialization_safe(data)))"
        ebpf_tracepoints:
          - "execve_trace"
          - "file_read_trace"
          - "http_request_trace"
        pattern: "unsafe_deserialization"
        
      - name: "missing_code_signing"
        description: "Detect execution of unsigned code or binaries"
        z3_constraint: "Forall(binary: Implies(binary_execution(binary), signature_valid(binary) AND signature_trusted(binary)))"
        ebpf_tracepoints:
          - "execve_trace"
          - "file_access_trace"
        pattern: "unsigned_binary_execution"
        
      - name: "ci_cd_integrity_failure"
        description: "Detect integrity failures in CI/CD pipelines"
        z3_constraint: "Forall(pipeline: Implies(ci_cd_execution(pipeline), pipeline_integrity_verified(pipeline)))"
        ebpf_tracepoints:
          - "execve_trace"
          - "file_write_trace"
          - "net_trace"
        pattern: "unverified_ci_cd_pipeline"
        
      - name: "unsigned_update"
        description: "Detect application or firmware updates without proper signature verification"
        z3_constraint: "Forall(update: Implies(update_application(update), update_signed(update) AND signature_verified(update)))"
        ebpf_tracepoints:
          - "file_write_trace"
          - "execve_trace"
          - "net_trace"
        pattern: "unsigned_update_applied"
        
      - name: "subresource_integrity"
        description: "Detect missing Subresource Integrity (SRI) for external resources"
        z3_constraint: "Forall(resource: Implies(external_resource(resource), sri_present(resource) AND sri_valid(resource)))"
        ebpf_tracepoints:
          - "net_trace"
          - "http_request_trace"
        pattern: "missing_sri_attribute"
        
  # A09:2021 - Security Logging and Monitoring Failures
  A09_2021_Security_Logging_and_Monitoring_Failures:
    category: "Logging"
    severity: "high"
    description: "Insufficient logging and monitoring of security events"
    
    detection_rules:
      - name: "missing_audit_logs"
        description: "Detect absence of audit logging for sensitive operations"
        z3_constraint: "Forall(operation: Implies(sensitive_operation(operation), audit_log_created(operation)))"
        ebpf_tracepoints:
          - "execve_trace"
          - "file_write_trace"
          - "http_request_trace"
        pattern: "sensitive_op_not_logged"
        
      - name: "insufficient_log_detail"
        description: "Detect logs with insufficient detail for incident response"
        z3_constraint: "Forall(log: Implies(log_event(log), contains_required_fields(log) AND contains_user_context(log)))"
        ebpf_tracepoints:
          - "file_write_trace"
          - "execve_trace"
        pattern: "insufficient_log_information"
        
      - name: "log_tampering"
        description: "Detect attempts to tamper with security logs"
        z3_constraint: "Forall(log_file: Implies(log_modification(log_file), authorized_log_access(log_file) AND log_integrity_verified(log_file)))"
        ebpf_tracepoints:
          - "file_write_trace"
          - "file_access_trace"
        pattern: "unauthorized_log_modification"
        
      - name: "missing_real_time_alerts"
        description: "Detect absence of real-time alerting for critical security events"
        z3_constraint: "Forall(event: Implies(critical_security_event(event), alert_generated(event) AND alert_sent_immediately(event)))"
        ebpf_tracepoints:
          - "execve_trace"
          - "net_trace"
        pattern: "critical_event_not_alerted"
        
      - name: "log_injection"
        description: "Detect log injection attacks"
        z3_constraint: "Forall(log_entry: Implies(log_creation(log_entry), log_entry_sanitized(log_entry) AND not_contains_control_chars(log_entry)))"
        ebpf_tracepoints:
          - "file_write_trace"
          - "http_request_trace"
        pattern: "log_injection_attempt"
        
  # A10:2021 - Server-Side Request Forgery
  A10_2021_Server_Side_Request_Forgery:
    category: "SSRF"
    severity: "critical"
    description: "Server-side request forgery allowing unauthorized access to internal resources"
    
    detection_rules:
      - name: "internal_network_access"
        description: "Detect attempts to access internal network resources"
        z3_constraint: "Forall(request: Implies(server_request(request), not_internal_destination(request) OR internal_access_authorized(request)))"
        ebpf_tracepoints:
          - "net_trace"
          - "http_request_trace"
          - "execve_trace"
        pattern: "internal_network_ssrf"
        
      - name: "cloud_metadata_access"
        description: "Detect attempts to access cloud metadata services"
        z3_constraint: "Forall(request: Implies(server_request(request), not_metadata_destination(request) OR metadata_access_authorized(request)))"
        ebpf_tracepoints:
          - "net_trace"
          - "http_request_trace"
        pattern: "cloud_metadata_access_attempt"
        
      - name: "url_ssrf"
        description: "Detect SSRF through URL parameters"
        z3_constraint: "Forall(url_param: Implies(url_used_in_request(url_param), url_whitelisted(url_param) AND url_not_internal(url_param)))"
        ebpf_tracepoints:
          - "http_request_trace"
          - "net_trace"
        pattern: "ssrf_via_url_parameter"
        
      - name: "file_protocol_ssrf"
        description: "Detect SSRF using file:// protocol"
        z3_constraint: "Forall(url: Implies(url_protocol(url) == 'file://', file_access_authorized(url) AND not_local_file_traversal(url)))"
        ebpf_tracepoints:
          - "file_access_trace"
          - "net_trace"
          - "http_request_trace"
        pattern: "file_protocol_ssrf_attempt"
        
    state_machine_rules:
      - name: "ssrf_attack_flow"
        initial_state: "user_request"
        states:
          - name: "user_request"
            transitions:
              - to: "url_validation"
                condition: "url_provided"
          - name: "url_validation"
            transitions:
              - to: "whitelist_check"
                condition: "url_parsed"
              - to: "blocked"
                condition: "Not(url_parsed)"
          - name: "whitelist_check"
            transitions:
              - to: "dns_resolution"
                condition: "url_whitelisted"
              - to: "blocked"
                condition: "Not(url_whitelisted)"
          - name: "dns_resolution"
            transitions:
              - to: "internal_check"
                condition: "dns_resolved"
              - to: "blocked"
                condition: "Not(dns_resolved)"
          - name: "internal_check"
            transitions:
              - to: "safe_request"
                condition: "not_internal_ip"
              - to: "blocked"
                condition: "internal_ip"
        violation_detection:
          - "Direct request without URL validation"
          - "Request to internal IP addresses without authorization"
          - "Request to cloud metadata endpoints"

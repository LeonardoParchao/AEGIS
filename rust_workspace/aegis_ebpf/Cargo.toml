[package]
name = "aegis_ebpf"
version = "0.1.0"
edition = "2021"

[dependencies]
aya-ebpf = "0.2"
aya-log-ebpf = "0.2"

[[bin]]
name = "aegis_ebpf"
path = "src/main.rs"

[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
